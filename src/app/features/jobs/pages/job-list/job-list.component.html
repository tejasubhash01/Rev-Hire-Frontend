<div class="job-list-container">
  <div class="search-section">
    <h2>Find Your Dream Job Today!</h2>
    <div class="search-form">
      <input type="text" placeholder="Job Title" [(ngModel)]="filter.title">
      <input type="text" placeholder="Location" [(ngModel)]="filter.location">
      <button (click)="search()">Search</button>
    </div>
  </div>

  <div class="jobs">
    <div *ngFor="let job of jobs" class="job-card">
      <h3>{{ job.title }}</h3>
      <p class="company">{{ job.companyName }}</p>
      <p class="location">{{ job.location }}</p>
      <p class="description">{{ job.description | slice:0:150 }}...</p>
      <div class="job-footer">
        <span class="salary" *ngIf="job.salaryMin">₹{{ job.salaryMin }} - ₹{{ job.salaryMax }}</span>
        <a [routerLink]="['/jobs', job.id]" class="view-details">View Details</a>
      </div>
    </div>
  </div>

  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button (click)="changePage(page-1)" [disabled]="page===0">Prev</button>
    <span>Page {{ page+1 }} of {{ totalPages }}</span>
    <button (click)="changePage(page+1)" [disabled]="page===totalPages-1">Next</button>
  </div>
</div>
