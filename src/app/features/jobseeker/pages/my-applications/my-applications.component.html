<div class="applications-container">
  <h1>My Applications</h1>

  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="!loading && applications.length === 0" class="no-data">
    You haven't applied to any jobs yet. <a routerLink="/jobs">Browse Jobs</a>
  </div>

  <div *ngFor="let app of applications" class="application-card">
    <h3>{{ app.jobTitle }}</h3>
    <p class="company">{{ app.companyName }}</p>
    <p class="applied-date">Applied: {{ app.appliedDate | date:'medium' }}</p>
    <p class="status" [ngClass]="getStatusClass(app.status)">Status: {{ app.status }}</p>
    <p *ngIf="app.coverLetter" class="cover-letter">Cover Letter: {{ app.coverLetter }}</p>
    <button *ngIf="app.status !== 'WITHDRAWN'" (click)="withdraw(app.id)" class="btn-withdraw">Withdraw</button>
    <a [routerLink]="['/jobs', app.jobPostId]" class="btn-view">View Job</a>
  </div>
</div>
